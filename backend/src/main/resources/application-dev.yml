spring:
  datasource:
    url: jdbc:h2:mem:nutrilift;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

gemini:
  api:
    key: ${GEMINI_API_KEY:AQ.Ab8RN6K0inGGTgMeZvHK6RbJ5sqVXkIIQwn1EkyvNbVoNX_f0A}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
